<style>
/* ===== À PERSONNALISER : couleurs et forme des boutons ===== */
:root{
  --fond:#000000;        /* fond noir */
  --orange:#fa5014;      /* orange (à remplacer par le code exact de la charte ARTE si tu l'as) */
  --texte:#ffffff;       /* texte blanc */
  --rayon:99px;          /* 6px = carré, 14px = arrondi, 99px = pilule */
}
/* ========================================================== */
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:var(--fond);color:var(--texte);
  font:400 16px/1.5 "Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  display:flex;justify-content:center;
  padding:calc(40px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px));
}
main{width:100%;max-width:420px;text-align:center}
.logo{display:block;width:100%;max-width:340px;height:auto;margin:0 auto 18px}
h1{margin:0;font-size:1.5rem;font-weight:800;letter-spacing:-.02em;color:var(--orange)}
p{margin:6px 0 26px;color:var(--texte)}
a.lien{display:block;margin-bottom:12px;padding:14px 18px;border-radius:var(--rayon);
  background:transparent;color:var(--texte);border:2px solid var(--orange);
  text-decoration:none;font-weight:600;transition:background .15s,color .15s}
a.lien:hover{background:var(--orange);color:var(--fond)}
a.lien:focus-visible{outline:3px solid var(--texte);outline-offset:3px}
</style>
</head>
